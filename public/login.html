<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetdoSystems — Iniciar sesión</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login">
      <div class="card-header marca"><span class="logo">M</span> MetdoSystems — Iniciar sesión</div>
      <form id="form" novalidate>
        <div id="error" class="alerta alerta-error oculto" role="alert"></div>
        <label class="campo">Email
          <input id="email" type="email" autocomplete="username" required>
        </label>
        <label class="campo">Contraseña
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primario" id="ingresar" type="submit">Ingresar</button>
        <div class="demo">Accesos de prueba para la demostración:
          <div class="demo-botones">
            <button type="button" data-email="juana.perez@metdosystems.com" data-pass="Reporte-Seguro-2026">Juana Pérez (Empleado)</button>
            <button type="button" data-email="marcos.diaz@metdosystems.com" data-pass="Gestion-Incidentes-TI-2026">Marcos Díaz (TI)</button>
          </div>
        </div>
      </form>
    </div>
  </div>
  <script src="/comun.js"></script>
  <script src="/login.js"></script>
</body>
</html>
